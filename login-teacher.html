<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sekolah Santo Andreas</title>
    <link rel="stylesheet" href="login-teacher.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
</head>

<body>

<div class="bg-image"></div>
    <div class="bg-overlay"></div>

<main class="login-wrapper">

        <div class="login-card">

<div class="brand">
                <img src="https://i.ibb.co.com/V033MvMm/St-Andreas-Logo.png" alt="Logo Sekolah Santo Andreas"
                    class="brand-logo">
                <h1 class="brand-title">Login Akun Guru</h1>
                <p class="brand-sub">Login ke akun Guru untuk mengatur tugas, mengelola berita, dan mengakses fitur
                    lainnya.</p>
            </div>

<div class="divider"></div>

<form class="login-form" onsubmit="return false;">

                <div class="field-group">
                    <i class="fas fa-user field-icon"></i>
                    <input type="text" id="username" class="field-input" placeholder="ID Guru" autocomplete="username">
                </div>

                <div class="field-group">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="password" class="field-input" placeholder="Password"
                        autocomplete="current-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="Tampilkan password">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <div class="form-meta">
                    <label class="remember">
                        <input type="checkbox" checked> Ingat saya
                    </label>
                </div>

                <button type="submit" class="login-btn" onclick="handleTeacherLogin()">
                    Verifikasikan Saya <i class="fas fa-arrow-right"></i>
                </button>

            </form>

        </div>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Beranda
        </a>

    </main>
    <script src="script-teacher.js"></script>
</body>

</html>

</body>

</html>
