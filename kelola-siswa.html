<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa — Portal Guru Santo Andreas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark: #04111f;
            --dark2: #0a1929;
            --blue: #0162a6;
            --blue-lt: #0088e3;
            --teal: #1ab8b8;
            --teal-lt: #22d3d3;
            --gold: #ffcc00;
            --white: #ffffff;
            --muted: rgba(255, 255, 255, 0.45);
            --border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.04);
            --sans: 'Plus Jakarta Sans', sans-serif;
            --display: 'Playfair Display', Georgia, serif;
        }

        body {
            font-family: var(--sans);
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
        }

        .portal-header {
            background: rgba(4, 17, 31, 0.95);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
        }

        .portal-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .portal-logo {
            height: 42px;
        }

        .portal-header-divider {
            width: 1px;
            height: 28px;
            background: var(--border);
        }

        .portal-header-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .portal-header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .teacher-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px;
        }

        .teacher-chip-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--blue-lt));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .teacher-chip-name {
            font-size: 13px;
            font-weight: 600;
            display: block;
        }

        .teacher-chip-role {
            font-size: 11px;
            color: var(--muted);
            display: block;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(218, 37, 30, 0.12);
            border: 1px solid rgba(218, 37, 30, 0.28);
            color: #ff8a8a;
            border-radius: 50px;
            padding: 9px 18px;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(218, 37, 30, 0.25);
            color: #fff;
        }

        .portal-body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 44px 40px 80px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 36px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 50px;
            padding: 9px 18px;
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: var(--white);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .page-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--teal);
            margin-bottom: 4px;
        }

        .page-title {
            font-family: var(--display);
            font-size: 28px;
            font-weight: 900;
        }

.stats-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .stat-icon-teal {
            background: linear-gradient(135deg, #0a6e6e, #1ab8b8);
            color: #fff;
        }

        .stat-icon-blue {
            background: linear-gradient(135deg, #0162a6, #0088e3);
            color: #fff;
        }

        .stat-icon-gold {
            background: linear-gradient(135deg, #b8900a, #ffcc00);
            color: var(--dark);
        }

        .stat-icon-purple {
            background: linear-gradient(135deg, #5a20a0, #9650dc);
            color: #fff;
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--white);
        }

.filter-bar {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-bar label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .filter-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 9px 14px;
            color: var(--white);
            font-family: var(--sans);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .filter-select option {
            background: var(--dark2);
        }

        .filter-select:focus {
            border-color: var(--teal);
        }

        .search-input {
            flex: 1;
            min-width: 180px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 9px 14px;
            color: var(--white);
            font-family: var(--sans);
            font-size: 13px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .search-input:focus {
            border-color: var(--teal);
        }

        .sheets-link {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(26, 184, 100, 0.12);
            border: 1px solid rgba(26, 184, 100, 0.28);
            color: #4ade80;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .sheets-link:hover {
            background: rgba(26, 184, 100, 0.22);
            color: #fff;
        }

.table-wrap {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            padding: 14px 18px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            text-align: left;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .data-table td {
            padding: 14px 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .student-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--teal), var(--teal-lt));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
            flex-shrink: 0;
        }

        .student-name-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-name {
            font-weight: 600;
            color: var(--white);
        }

        .student-id {
            font-size: 11px;
            color: var(--muted);
        }

        .badge-aktif {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
        }

        .badge-non-aktif {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(218, 37, 30, 0.12);
            color: #ff8a8a;
        }

        .badge-sd {
            background: rgba(0, 136, 227, 0.12);
            color: #60a5fa;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            display: inline-block;
        }

        .badge-smp {
            background: rgba(150, 80, 220, 0.12);
            color: #c084fc;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 9px;
            border-radius: 20px;
            display: inline-block;
        }

        .results-info {
            font-size: 13px;
            color: var(--muted);
            padding: 16px 18px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state i {
            font-size: 36px;
            margin-bottom: 14px;
            display: block;
            color: rgba(255, 255, 255, 0.15);
        }

        .empty-state p {
            font-size: 14px;
        }

        .loading-row td {
            text-align: center;
            padding: 48px;
            color: var(--muted);
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(16px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .anim {
            animation: fade-up 0.45s ease both;
        }

        .anim-1 {
            animation-delay: .05s
        }

        .anim-2 {
            animation-delay: .10s
        }

        .anim-3 {
            animation-delay: .15s
        }

        .anim-4 {
            animation-delay: .20s
        }

        @media(max-width:900px) {
            .portal-header {
                padding: 0 20px
            }

            .portal-body {
                padding: 28px 20px 60px
            }

            .stats-strip {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(max-width:600px) {
            .stats-strip {
                grid-template-columns: 1fr 1fr
            }

            .data-table th:nth-child(3),
            .data-table td:nth-child(3),
            .data-table th:nth-child(5),
            .data-table td:nth-child(5),
            .data-table th:nth-child(6),
            .data-table td:nth-child(6) {
                display: none
            }
        }
        @media (max-width: 768px) {
            .teacher-chip-name, .teacher-chip-role { display: none !important; }
        }
    </style>
</head>

<body>

    <header class="portal-header">
        <div class="portal-header-left">
            <img src="https://i.ibb.co.com/V033MvMm/St-Andreas-Logo.png" alt="Logo" class="portal-logo">
            <div class="portal-header-divider"></div>
            <span class="portal-header-label">Portal Guru</span>
        </div>
        <div class="portal-header-right">
            <div class="teacher-chip">
                <div class="teacher-chip-avatar" id="avatarInitials">?</div>
                <div><span class="teacher-chip-name" id="headerName">—</span><span class="teacher-chip-role"
                        id="headerRole">—</span></div>
            </div>
            <button class="logout-btn" onclick="teacherLogout()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
        </div>
    </header>

    <div class="portal-body">
        <div class="page-header anim anim-1">
            <a href="portal-guru.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
            <div>
                <p class="page-eyebrow">Data Siswa</p>
                <h1 class="page-title">Daftar & Data Siswa</h1>
            </div>
        </div>

<div class="stats-strip anim anim-2">
            <div class="stat-box">
                <div class="stat-icon stat-icon-teal"><i class="fas fa-users"></i></div>
                <div><span class="stat-label">Total Siswa</span><span class="stat-value" id="statTotal">—</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-icon stat-icon-blue"><i class="fas fa-school"></i></div>
                <div><span class="stat-label">Siswa SD</span><span class="stat-value" id="statSD">—</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-icon stat-icon-purple"><i class="fas fa-graduation-cap"></i></div>
                <div><span class="stat-label">Siswa SMP</span><span class="stat-value" id="statSMP">—</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-icon stat-icon-gold"><i class="fas fa-circle-check"></i></div>
                <div><span class="stat-label">Aktif</span><span class="stat-value" id="statAktif">—</span></div>
            </div>
        </div>

<div class="filter-bar anim anim-3">
            <label>Filter:</label>
            <select class="filter-select" id="filterJenjang" onchange="applyFilter()">
                <option value="">Semua Jenjang</option>
                <option value="sd">SD</option>
                <option value="smp">SMP</option>
            </select>
            <select class="filter-select" id="filterKelas" onchange="applyFilter()">
                <option value="">Semua Kelas</option>
            </select>
            <select class="filter-select" id="filterStatus" onchange="applyFilter()">
                <option value="">Semua Status</option>
                <option value="active">Aktif</option>
                <option value="inactive">Non-Aktif</option>
            </select>
            <input type="search" class="search-input" id="searchInput" placeholder="Cari nama siswa atau ID..."
                oninput="applyFilter()">
            <a href="#" target="_blank" class="sheets-link" id="sheetsLink"><i
                    class="fas fa-table-cells"></i> Edit Sheets</a>
        </div>

<div class="table-wrap anim anim-4">
            <p class="results-info" id="resultsInfo">Memuat data...</p>
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:40px">#</th>
                        <th>Siswa</th>
                        <th>Jenjang</th>
                        <th>Kelas</th>
                        <th>File Rapor</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr class="loading-row">
                        <td colspan="6"><i class="fas fa-spinner fa-spin" style="margin-right:8px"></i>Memuat data
                            siswa...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script-teacher.js"></script>
    <script>
        const SISWA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTreOQ_yv8kN98ByfBr13q_eTPzhex5i5EHs2gdVXyWs9CZYVDTZEpyiaYDKLmL8jcSKXBsVEc9nd4v/pub?output=csv";
        const SISWA_SHEET_URL = "https://docs.google.com/spreadsheets/d/1Jrnbs_Dl8m__rFJz1uCF6iGfsLa9bcnzKDg-b8Ipt5E/edit?gid=229791042#gid=229791042";

        let allStudents = [];

        document.addEventListener("DOMContentLoaded", () => {
            const teacher = requireTeacherAuth();
            if (!teacher) return;
            const ini = teacher.name.split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
            document.getElementById("avatarInitials").textContent = ini;
            document.getElementById("headerName").textContent = teacher.name;
            document.getElementById("headerRole").textContent = teacher.jabatan || teacher.id;
            if (!SISWA_SHEET_URL.includes("PASTE")) document.getElementById("sheetsLink").href = SISWA_SHEET_URL;
            loadStudents();
        });

        async function loadStudents() {
            if (SISWA_CSV_URL.includes("PASTE")) {
                allStudents = DEMO_STUDENTS;
                renderAll();
                return;
            }
            try {
                const res = await fetch(SISWA_CSV_URL);
                const text = await res.text();
                const rows = parseCSV(text);

                allStudents = rows.map(r => ({
                    id: r[0] || "", nama: r[1] || "", status: (r[2] || "").toLowerCase(),
                    jenjang: (r[4] || "").toLowerCase(), fileId: r[5] || "", kelas: r[6] || ""
                })).filter(s => s.nama);
                renderAll();
            } catch {
                allStudents = DEMO_STUDENTS;
                renderAll();
            }
        }

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            if (lines.length < 2) return [];
            return lines.slice(1).map(line => {
                const cells = []; let cur = "", inQ = false;
                for (let c of line) { if (c === '"') { inQ = !inQ } else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = "" } else cur += c }
                cells.push(cur.trim()); return cells;
            }).filter(r => r.some(c => c));
        }

        function populateKelasFilter(students) {
            const kelas = [...new Set(students.map(s => s.kelas).filter(Boolean))].sort();
            const sel = document.getElementById("filterKelas");
            const cur = sel.value;
            sel.innerHTML = '<option value="">Semua Kelas</option>' + kelas.map(k => `<option value="${k}">${k}</option>`).join("");
            if (cur) sel.value = cur;
        }

        function renderAll() {
            updateStats(allStudents);
            populateKelasFilter(allStudents);
            applyFilter();
        }

        function applyFilter() {
            const jenjang = document.getElementById("filterJenjang").value.toLowerCase();
            const kelas = document.getElementById("filterKelas").value;
            const status = document.getElementById("filterStatus").value;
            const q = document.getElementById("searchInput").value.toLowerCase();

if (jenjang) {
                populateKelasFilter(allStudents.filter(s => s.jenjang === jenjang));
            } else {
                populateKelasFilter(allStudents);
            }

            const filtered = allStudents.filter(s => {
                if (jenjang && s.jenjang !== jenjang) return false;
                if (kelas && s.kelas !== kelas) return false;
                if (status && s.status !== status) return false;
                if (q && !s.nama.toLowerCase().includes(q) && !s.id.toLowerCase().includes(q)) return false;
                return true;
            });
            renderTable(filtered);
            document.getElementById("resultsInfo").textContent = `Menampilkan ${filtered.length} dari ${allStudents.length} siswa`;
        }

        function getInitials(name) {
            return name.split(" ").slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?";
        }

        function renderTable(data) {
            const tbody = document.getElementById("studentTable");
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-user-slash"></i><p>Tidak ada siswa yang sesuai filter.</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = data.map((s, i) => {
                const fileCell = s.fileId
                    ? `<a href="https://drive.google.com/file/d/${s.fileId}/view" target="_blank" style="display:inline-flex;align-items:center;gap:5px;color:#4ade80;font-size:12px;font-weight:600;text-decoration:none;"><i class="fas fa-file-alt"></i> Lihat</a>`
                    : `<span style="color:var(--muted);font-size:12px">—</span>`;
                return `
        <tr>
            <td style="color:var(--muted);font-size:12px">${i + 1}</td>
            <td>
                <div class="student-name-cell">
                    <div class="student-avatar">${getInitials(s.nama)}</div>
                    <div>
                        <div class="student-name">${s.nama}</div>
                        <div class="student-id">${s.id}</div>
                    </div>
                </div>
            </td>
            <td><span class="badge-${s.jenjang || 'sd'}">${(s.jenjang || 'sd').toUpperCase()}</span></td>
            <td style="color:rgba(255,255,255,0.7)">${s.kelas || "—"}</td>
            <td>${fileCell}</td>
            <td>${s.status === "active" ? '<span class="badge-aktif"><i class="fas fa-circle" style="font-size:7px"></i> Aktif</span>' : '<span class="badge-non-aktif"><i class="fas fa-circle" style="font-size:7px"></i> Non-Aktif</span>'}</td>
        </tr>`;
            }).join("");
        }

        function updateStats(students) {
            const sd = students.filter(s => s.jenjang === "sd").length;
            const smp = students.filter(s => s.jenjang === "smp").length;
            const aktif = students.filter(s => s.status === "active").length;
            document.getElementById("statTotal").textContent = students.length;
            document.getElementById("statSD").textContent = sd;
            document.getElementById("statSMP").textContent = smp;
            document.getElementById("statAktif").textContent = aktif;
        }
    </script>
</body>

</html>
