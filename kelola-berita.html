<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Berita — Portal Guru Santo Andreas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dark: #04111f; --dark2: #0a1929;
            --blue: #0162a6; --blue-lt: #0088e3;
            --gold: #ffcc00; --white: #ffffff;
            --muted: rgba(255,255,255,0.45); --border: rgba(255,255,255,0.08);
            --card-bg: rgba(255,255,255,0.04);
            --sans: 'Plus Jakarta Sans', sans-serif;
            --display: 'Playfair Display', Georgia, serif;
        }
        body { font-family: var(--sans); background: var(--dark); color: var(--white); min-height: 100vh; }
        .portal-header { background: rgba(4,17,31,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 68px; }
        .portal-header-left { display: flex; align-items: center; gap: 20px; }
        .portal-logo { height: 42px; }
        .portal-header-divider { width: 1px; height: 28px; background: var(--border); }
        .portal-header-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        .portal-header-right { display: flex; align-items: center; gap: 16px; }
        .teacher-chip { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 50px; padding: 8px 16px; }
        .teacher-chip-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,var(--blue),var(--blue-lt)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .teacher-chip-name { font-size: 13px; font-weight: 600; display: block; }
        .teacher-chip-role { font-size: 11px; color: var(--muted); display: block; }
        .logout-btn { display: flex; align-items: center; gap: 8px; background: rgba(218,37,30,0.12); border: 1px solid rgba(218,37,30,0.28); color: #ff8a8a; border-radius: 50px; padding: 9px 18px; font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .logout-btn:hover { background: rgba(218,37,30,0.25); color: #fff; }
        .portal-body { max-width: 1200px; margin: 0 auto; padding: 44px 40px 80px; }
        .page-header { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
        .back-btn { display: flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border); color: var(--muted); border-radius: 50px; padding: 9px 18px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
        .page-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blue-lt); margin-bottom: 4px; }
        .page-title { font-family: var(--display); font-size: 28px; font-weight: 900; }
        .mgmt-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
        .mgmt-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 32px; }
        .mgmt-panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .mgmt-panel-title i { color: var(--blue-lt); }
        .field-group { margin-bottom: 18px; }
        .field-label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .field-input, .field-select, .field-textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 12px 16px; color: var(--white); font-family: var(--sans); font-size: 14px; outline: none; transition: border-color 0.2s, background 0.2s; }
        .field-input::placeholder, .field-textarea::placeholder { color: var(--muted); }
        .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--blue-lt); background: rgba(0,136,227,0.08); }
        .field-select option { background: var(--dark2); }
        .field-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .field-check { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; cursor: pointer; }
        .field-check input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--blue-lt); }
        .field-check span { font-size: 14px; color: rgba(255,255,255,0.8); }
        .submit-btn { width: 100%; background: linear-gradient(135deg,#0162a6,#0088e3); border: none; border-radius: 14px; padding: 15px; color: var(--white); font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.25s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,136,227,0.3); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .entries-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .entries-count { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
        .sheets-link { display: flex; align-items: center; gap: 7px; background: rgba(26,184,100,0.12); border: 1px solid rgba(26,184,100,0.28); color: #4ade80; border-radius: 50px; padding: 7px 14px; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .sheets-link:hover { background: rgba(26,184,100,0.22); color: #fff; }
        .view-berita-btn { display: flex; align-items: center; gap: 7px; background: rgba(0,136,227,0.12); border: 1px solid rgba(0,136,227,0.28); color: var(--blue-lt); border-radius: 50px; padding: 7px 14px; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .view-berita-btn:hover { background: rgba(0,136,227,0.22); color: #fff; }
        .entry-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
        .entry-card-img { width: 100%; height: 100px; object-fit: cover; display: block; }
        .entry-card-img-placeholder { width: 100%; height: 60px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px; }
        .entry-card-body { padding: 14px 16px; }
        .entry-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .entry-title { font-size: 13px; font-weight: 700; color: var(--white); line-height: 1.4; }
        .entry-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
        .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
        .badge-event    { background: rgba(1,98,166,0.2);   color: #60a5fa; }
        .badge-prestasi { background: rgba(255,204,0,0.15); color: var(--gold); }
        .badge-kegiatan { background: rgba(26,184,100,0.15);color: #4ade80; }
        .badge-featured { background: rgba(255,100,0,0.15); color: #fb923c; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state i { font-size: 32px; margin-bottom: 12px; display: block; }
        .toast { position: fixed; bottom: 32px; right: 32px; border-radius: 14px; padding: 14px 22px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); z-index: 999; animation: toast-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
        .toast-ok  { background: rgba(26,184,100,0.92); border: 1px solid rgba(74,222,128,0.4); }
        .toast-err { background: rgba(218,37,30,0.92);  border: 1px solid rgba(255,100,100,0.4); }
        @keyframes toast-in { from{opacity:0;transform:translateY(20px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes fade-up { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .anim { animation: fade-up 0.45s ease both; }
        .anim-1 { animation-delay:.05s } .anim-2 { animation-delay:.10s } .anim-3 { animation-delay:.15s }
        @media(max-width:900px) { .mgmt-layout{grid-template-columns:1fr} .portal-header{padding:0 20px} .portal-body{padding:28px 20px 60px} }
        @media(max-width:560px) { .field-row{grid-template-columns:1fr} }
    </style>
</head>
<body>
<header class="portal-header">
    <div class="portal-header-left">
        <img src="https://i.ibb.co.com/V033MvMm/St-Andreas-Logo.png" alt="Logo" class="portal-logo">
        <div class="portal-header-divider"></div>
        <span class="portal-header-label">Portal Guru</span>
    </div>
    <div class="portal-header-right">
        <div class="teacher-chip">
            <div class="teacher-chip-avatar" id="avatarInitials">?</div>
            <div><span class="teacher-chip-name" id="headerName">—</span><span class="teacher-chip-role" id="headerRole">—</span></div>
        </div>
        <button class="logout-btn" onclick="teacherLogout()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    </div>
</header>

<div class="portal-body">
    <div class="page-header anim anim-1">
        <a href="portal-guru.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
        <div>
            <p class="page-eyebrow">Website Sekolah</p>
            <h1 class="page-title">Kelola Berita & Artikel</h1>
        </div>
    </div>

    <div class="mgmt-layout">
        
        <div class="anim anim-2">
            <div class="mgmt-panel">
                <p class="mgmt-panel-title"><i class="fas fa-plus-circle"></i> Tambah Artikel Baru</p>
                <form id="beritaForm" onsubmit="submitBerita(event)">
                    <div class="field-group">
                        <label class="field-label">Judul Artikel</label>
                        <input type="text" class="field-input" id="bJudul" placeholder="Tulis judul artikel yang menarik..." required>
                    </div>
                    <div class="field-row">
                        <div class="field-group" style="margin-bottom:0">
                            <label class="field-label">Kategori</label>
                            <select class="field-select" id="bKategori">
                                <option value="event">Event</option>
                                <option value="prestasi">Prestasi</option>
                                <option value="kegiatan">Kegiatan</option>
                            </select>
                        </div>
                        <div class="field-group" style="margin-bottom:0">
                            <label class="field-label">Tanggal</label>
                            <input type="date" class="field-input" id="bTanggal" required>
                        </div>
                    </div>
                    <div class="field-group" style="margin-top:18px">
                        <label class="field-label">Ringkasan / Excerpt</label>
                        <textarea class="field-textarea" id="bExcerpt" placeholder="Tulis ringkasan singkat artikel (2-3 kalimat)..." required></textarea>
                    </div>
                    <div class="field-group">
                        <label class="field-label">URL Gambar</label>
                        <input type="url" class="field-input" id="bImg" placeholder="https://... (opsional, bisa dari Google Drive atau link gambar)">
                    </div>
                    <div class="field-group">
                        <label class="field-label">Konten Artikel Lengkap</label>
                        <textarea class="field-textarea" id="bKonten" placeholder="Tulis isi artikel lengkap di sini. Pisahkan paragraf dengan baris kosong.&#10;&#10;Bisa juga pakai tag HTML dasar: &lt;b&gt;tebal&lt;/b&gt;, &lt;i&gt;miring&lt;/i&gt;, &lt;h2&gt;Subjudul&lt;/h2&gt;" style="min-height:180px;"></textarea>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Penulis</label>
                        <input type="text" class="field-input" id="bPenulis" placeholder="Nama penulis / redaksi">
                    </div>
                    <label class="field-check">
                        <input type="checkbox" id="bFeatured">
                        <span>⭐ Jadikan Artikel Unggulan (Featured)</span>
                    </label>
                    <button type="submit" class="submit-btn" id="submitBtn" style="margin-top:18px;">
                        <i class="fas fa-newspaper"></i> Publikasikan Artikel
                    </button>
                </form>
            </div>
        </div>

<div class="anim anim-3">
            <div class="mgmt-panel">
                <div class="entries-header">
                    <p class="mgmt-panel-title" style="margin-bottom:0"><i class="fas fa-list"></i> Artikel Terbaru</p>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <a href="berita.html" target="_blank" class="view-berita-btn"><i class="fas fa-eye"></i> Lihat</a>
                        <a href="https://docs.google.com/spreadsheets/d/1e7PArEvPCEEVRivsxvsOFkSTxto5OBmkqwhcWSqKCxo/edit?gid=972086544#gid=972086544" target="_blank" class="sheets-link" id="sheetsLink"><i class="fas fa-table-cells"></i> Sheets</a>
                    </div>
                </div>
                <p class="entries-count" id="entriesCount" style="margin-bottom:16px">Memuat data...</p>
                <div id="entriesList"></div>
            </div>
        </div>
    </div>
</div>

<script src="script-teacher.js"></script>
<script>
    const APPS_SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbyzoJ6al8IFMcig-95qSDSzUFIQxXA3SpHMyv6_ySeANXrpVeJHt5FLFJKjqfGjQc9W/exec";
    const BERITA_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx_pImd28cyYnmmseB7CbMesjiATYiEdkyq-tC0h7pCX-VmAwXoOc8IN2diJx6CQD0cWzr27n_7KPu/pub?output=csv";
    const BERITA_SHEET_URL = "https://docs.google.com/spreadsheets/d/1TC2m0NYBf4kAUjx-g9q4_WHePEA3k7mbosPRTME0NxI/edit?gid=0#gid=0";

    let teacher = null;
    document.addEventListener("DOMContentLoaded", () => {
        teacher = requireTeacherAuth();
        if (!teacher) return;
        const ini = teacher.name.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
        document.getElementById("avatarInitials").textContent = ini;
        document.getElementById("headerName").textContent = teacher.name;
        document.getElementById("headerRole").textContent = teacher.jabatan || teacher.id;
        document.getElementById("bPenulis").value = teacher.name;
        document.getElementById("bTanggal").value = new Date().toISOString().split("T")[0];
        if (!BERITA_SHEET_URL.includes("PASTE")) document.getElementById("sheetsLink").href = BERITA_SHEET_URL;
        loadEntries();
    });

    const DEMO = [
        { judul:"Pembukaan PPDB 2026", kategori:"event", tanggal:"28 Oktober 2025", excerpt:"Sekolah Santo Andreas resmi membuka pendaftaran siswa baru tahun ajaran 2026/2027.", img:"https://santoandreas.sch.id/wp-content/uploads/2024/09/SMP-3.jpg", featured:true, penulis:"Redaksi" },
        { judul:"Pelantikan OSIS 2025", kategori:"prestasi", tanggal:"28 Oktober 2025", excerpt:"Generasi pemimpin baru SMP Santo Andreas resmi dilantik di momen Sumpah Pemuda.", img:"", featured:false, penulis:"Redaksi" },
    ];

    async function loadEntries() {
        const countEl = document.getElementById("entriesCount");
        if (BERITA_CSV_URL.includes("PASTE")) { renderEntries(DEMO); countEl.textContent = `${DEMO.length} artikel (demo)`; return; }
        try {
            const res  = await fetch(BERITA_CSV_URL);
            const text = await res.text();
            const rows = parseCSV(text);
            const data = rows.map(r => ({ judul:r[0]||"", kategori:(r[1]||"kegiatan").toLowerCase(), tanggal:r[2]||"", excerpt:r[3]||"", img:r[4]||"", featured:r[5]==="true", penulis:r[6]||"" })).filter(e=>e.judul);
            renderEntries(data); countEl.textContent = `${data.length} artikel`;
        } catch { renderEntries(DEMO); countEl.textContent = `${DEMO.length} artikel (demo)`; }
    }

    function parseCSV(text) {
        const results = [];
        let cols = [], cur = '', inQ = false;
        const t = text.trim();
        for (let i = 0; i < t.length; i++) {
            const ch = t[i];
            if (ch === '"') {
                if (inQ && t[i + 1] === '"') { cur += '"'; i++; }
                else inQ = !inQ;
            } else if (ch === ',' && !inQ) {
                cols.push(cur); cur = '';
            } else if ((ch === '\n' || ch === '\r') && !inQ) {
                if (ch === '\r' && t[i + 1] === '\n') i++;
                cols.push(cur); cur = '';
                if (cols.some(c => c)) results.push(cols);
                cols = [];
            } else {
                cur += ch;
            }
        }
        cols.push(cur);
        if (cols.some(c => c)) results.push(cols);
        const first = (results[0] && results[0][0]) ? results[0][0].trim().toLowerCase() : "";
        const isHeader = first === "judul" || first === "title" || first === "no";
        return isHeader ? results.slice(1) : results;
    }

    const BADGE_CLASS = { event:"badge-event", prestasi:"badge-prestasi", kegiatan:"badge-kegiatan" };

    function renderEntries(data) {
        const c = document.getElementById("entriesList");
        if (!data.length) { c.innerHTML=`<div class="empty-state"><i class="fas fa-newspaper"></i><p>Belum ada artikel.</p></div>`; return; }
        c.innerHTML = data.map(e => `
        <div class="entry-card">
            ${e.img ? `<img src="${e.img}" alt="${e.judul}" class="entry-card-img">` : `<div class="entry-card-img-placeholder"><i class="fas fa-image"></i></div>`}
            <div class="entry-card-body">
                <div class="entry-card-top">
                    <span class="badge ${BADGE_CLASS[e.kategori]||'badge-kegiatan'}">${e.kategori}</span>
                    ${e.featured ? `<span class="badge badge-featured">⭐ Featured</span>` : ""}
                </div>
                <div class="entry-title">${e.judul}</div>
                <div class="entry-meta"><i class="fas fa-calendar-alt"></i> ${e.tanggal} · ${e.penulis}</div>
            </div>
        </div>`).join("");
    }

    async function submitBerita(e) {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mempublikasikan...';
        const payload = {
            type:"berita",
            judul:    document.getElementById("bJudul").value.trim(),
            kategori: document.getElementById("bKategori").value,
            tanggal:  document.getElementById("bTanggal").value,
            excerpt:  document.getElementById("bExcerpt").value.trim(),
            imgUrl:   document.getElementById("bImg").value.trim(),
            konten:   document.getElementById("bKonten").value.trim(),
            penulis:  document.getElementById("bPenulis").value.trim(),
            featured: document.getElementById("bFeatured").checked ? "true" : "false"
        };
        if (APPS_SCRIPT_URL.includes("PASTE")) {
            await new Promise(r=>setTimeout(r,900));
            document.getElementById("beritaForm").reset();
            if(teacher) document.getElementById("bPenulis").value = teacher.name;
            showToast("Demo: artikel akan tersimpan setelah Apps Script terhubung.");
        } else {
            try {
                const blob = new Blob([JSON.stringify(payload)], { type: "text/plain" });
                navigator.sendBeacon(APPS_SCRIPT_URL, blob);
                document.getElementById("beritaForm").reset();
                if(teacher) document.getElementById("bPenulis").value = teacher.name;
                showToast("✅ Artikel berhasil dipublikasikan!");
                setTimeout(loadEntries,2000);
            } catch { showToast("❌ Gagal menyimpan. Coba lagi.", true); }
        }
        btn.disabled=false; btn.innerHTML='<i class="fas fa-newspaper"></i> Publikasikan Artikel';
    }

    function showToast(msg, isErr=false) {
        const ex = document.querySelector(".toast"); if(ex) ex.remove();
        const t = document.createElement("div"); t.className="toast "+(isErr?"toast-err":"toast-ok"); t.textContent=msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(),4000);
    }
</script>
</body>
</html>
