<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kalender Akademik — Portal Guru Santo Andreas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --dark: #04111f; --dark2: #0a1929;
            --blue: #0162a6; --blue-lt: #0088e3;
            --gold: #ffcc00; --white: #ffffff;
            --muted: rgba(255,255,255,0.45); --border: rgba(255,255,255,0.08);
            --card-bg: rgba(255,255,255,0.04);
            --sans: 'Plus Jakarta Sans', sans-serif;
            --display: 'Playfair Display', Georgia, serif;
        }
        body { font-family: var(--sans); background: var(--dark); color: var(--white); min-height: 100vh; }
        .portal-header { background: rgba(4,17,31,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 68px; }
        .portal-header-left { display: flex; align-items: center; gap: 20px; }
        .portal-logo { height: 42px; }
        .portal-header-divider { width: 1px; height: 28px; background: var(--border); }
        .portal-header-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        .portal-header-right { display: flex; align-items: center; gap: 16px; }
        .teacher-chip { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 50px; padding: 8px 16px; }
        .teacher-chip-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,var(--blue),var(--blue-lt)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .teacher-chip-name { font-size: 13px; font-weight: 600; display: block; }
        .teacher-chip-role { font-size: 11px; color: var(--muted); display: block; }
        .logout-btn { display: flex; align-items: center; gap: 8px; background: rgba(218,37,30,0.12); border: 1px solid rgba(218,37,30,0.28); color: #ff8a8a; border-radius: 50px; padding: 9px 18px; font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .logout-btn:hover { background: rgba(218,37,30,0.25); color: #fff; }
        .portal-body { max-width: 1200px; margin: 0 auto; padding: 44px 40px 80px; }
        .page-header { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
        .back-btn { display: flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--border); color: var(--muted); border-radius: 50px; padding: 9px 18px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
        .page-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
        .page-title { font-family: var(--display); font-size: 28px; font-weight: 900; }
        .mgmt-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
        .mgmt-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 32px; }
        .mgmt-panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .mgmt-panel-title i { color: var(--gold); }
        .field-group { margin-bottom: 18px; }
        .field-label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
        .field-input, .field-select, .field-textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 12px 16px; color: var(--white); font-family: var(--sans); font-size: 14px; outline: none; transition: border-color 0.2s, background 0.2s; }
        .field-input::placeholder, .field-textarea::placeholder { color: var(--muted); }
        .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--gold); background: rgba(255,204,0,0.05); }
        .field-select option { background: var(--dark2); }
        .field-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .submit-btn { width: 100%; background: linear-gradient(135deg,#b8900a,#ffcc00); border: none; border-radius: 14px; padding: 15px; color: var(--dark); font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.25s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,204,0,0.25); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .entries-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .entries-count { font-size: 13px; color: var(--muted); }
        .sheets-link { display: flex; align-items: center; gap: 7px; background: rgba(26,184,100,0.12); border: 1px solid rgba(26,184,100,0.28); color: #4ade80; border-radius: 50px; padding: 7px 14px; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .sheets-link:hover { background: rgba(26,184,100,0.22); color: #fff; }
        .view-cal-btn { display: flex; align-items: center; gap: 7px; background: rgba(255,204,0,0.10); border: 1px solid rgba(255,204,0,0.28); color: var(--gold); border-radius: 50px; padding: 7px 14px; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .view-cal-btn:hover { background: rgba(255,204,0,0.20); color: #fff; }
        
        .event-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
        .event-date-box { flex-shrink: 0; width: 48px; text-align: center; background: rgba(255,204,0,0.08); border: 1px solid rgba(255,204,0,0.2); border-radius: 10px; padding: 8px 4px; }
        .event-date-day { font-size: 20px; font-weight: 800; color: var(--gold); line-height: 1; display: block; }
        .event-date-mon { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; display: block; margin-top: 2px; }
        .event-info { flex: 1; min-width: 0; }
        .event-title { font-size: 13px; font-weight: 700; color: var(--white); margin-bottom: 4px; }
        .event-sub { font-size: 11px; color: var(--muted); line-height: 1.5; }
        .event-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-bottom: 4px; }
        .badge-liburan  { background: rgba(74,222,128,0.15); color: #4ade80; }
        .badge-ujian    { background: rgba(218,37,30,0.15);   color: #ff8a8a; }
        .badge-kegiatan { background: rgba(1,98,166,0.2);     color: #60a5fa; }
        .badge-upacara  { background: rgba(255,204,0,0.15);   color: var(--gold); }
        .badge-rapat    { background: rgba(150,80,220,0.15);  color: #c084fc; }
        .badge-lainnya  { background: rgba(255,255,255,0.08); color: var(--muted); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state i { font-size: 32px; margin-bottom: 12px; display: block; }
        
        .color-picker-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        .color-dot-label { position: relative; cursor: pointer; }
        .color-dot-label input { position: absolute; opacity: 0; width: 0; height: 0; }
        .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; transition: border-color 0.2s, transform 0.15s; }
        .color-dot-label input:checked + .color-dot { border-color: var(--white); transform: scale(1.15); }
        .toast { position: fixed; bottom: 32px; right: 32px; border-radius: 14px; padding: 14px 22px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.4); z-index: 999; animation: toast-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
        .toast-ok  { background: rgba(26,184,100,0.92); border: 1px solid rgba(74,222,128,0.4); }
        .toast-err { background: rgba(218,37,30,0.92);  border: 1px solid rgba(255,100,100,0.4); }
        @keyframes toast-in { from{opacity:0;transform:translateY(20px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes fade-up { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .anim { animation: fade-up 0.45s ease both; }
        .anim-1 { animation-delay:.05s } .anim-2 { animation-delay:.10s } .anim-3 { animation-delay:.15s }
        @media(max-width:900px) { .mgmt-layout{grid-template-columns:1fr} .portal-header{padding:0 20px} .portal-body{padding:28px 20px 60px} }
        @media(max-width:560px) { .field-row{grid-template-columns:1fr} }
    </style>
</head>
<body>

<header class="portal-header">
    <div class="portal-header-left">
        <img src="https://i.ibb.co.com/V033MvMm/St-Andreas-Logo.png" alt="Logo" class="portal-logo">
        <div class="portal-header-divider"></div>
        <span class="portal-header-label">Portal Guru</span>
    </div>
    <div class="portal-header-right">
        <div class="teacher-chip">
            <div class="teacher-chip-avatar" id="avatarInitials">?</div>
            <div><span class="teacher-chip-name" id="headerName">—</span><span class="teacher-chip-role" id="headerRole">—</span></div>
        </div>
        <button class="logout-btn" onclick="teacherLogout()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    </div>
</header>

<div class="portal-body">
    <div class="page-header anim anim-1">
        <a href="portal-guru.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
        <div>
            <p class="page-eyebrow">Kalender Akademik</p>
            <h1 class="page-title">Kelola Kalender Akademik</h1>
        </div>
    </div>

    <div class="mgmt-layout">
        
        <div class="anim anim-2">
            <div class="mgmt-panel">
                <p class="mgmt-panel-title"><i class="fas fa-plus-circle"></i> Tambah Acara / Kegiatan</p>
                <form id="kalenderForm" onsubmit="submitKalender(event)">
                    <div class="field-group">
                        <label class="field-label">Judul Acara</label>
                        <input type="text" class="field-input" id="kJudul" placeholder="Cth: Ujian Tengah Semester, Libur Idul Fitri..." required>
                    </div>
                    <div class="field-row">
                        <div class="field-group" style="margin-bottom:0">
                            <label class="field-label">Tanggal Mulai</label>
                            <input type="date" class="field-input" id="kTanggalMulai" required>
                        </div>
                        <div class="field-group" style="margin-bottom:0">
                            <label class="field-label">Tanggal Selesai</label>
                            <input type="date" class="field-input" id="kTanggalSelesai">
                        </div>
                    </div>
                    <div class="field-group" style="margin-top:18px">
                        <label class="field-label">Kategori</label>
                        <select class="field-select" id="kKategori">
                            <option value="kegiatan">Kegiatan Sekolah</option>
                            <option value="ujian">Ujian / Penilaian</option>
                            <option value="liburan">Hari Libur</option>
                            <option value="upacara">Upacara / Seremonial</option>
                            <option value="rapat">Rapat / Pertemuan</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Keterangan (Opsional)</label>
                        <textarea class="field-textarea" id="kKeterangan" placeholder="Tambahkan detail atau keterangan tambahan..."></textarea>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Warna Label</label>
                        <div class="color-picker-row">
                            <label class="color-dot-label"><input type="radio" name="warna" value="#0088e3" checked><div class="color-dot" style="background:#0088e3"></div></label>
                            <label class="color-dot-label"><input type="radio" name="warna" value="#ffcc00"><div class="color-dot" style="background:#ffcc00"></div></label>
                            <label class="color-dot-label"><input type="radio" name="warna" value="#da251e"><div class="color-dot" style="background:#da251e"></div></label>
                            <label class="color-dot-label"><input type="radio" name="warna" value="#4ade80"><div class="color-dot" style="background:#4ade80"></div></label>
                            <label class="color-dot-label"><input type="radio" name="warna" value="#c084fc"><div class="color-dot" style="background:#c084fc"></div></label>
                            <label class="color-dot-label"><input type="radio" name="warna" value="#fb923c"><div class="color-dot" style="background:#fb923c"></div></label>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <i class="fas fa-calendar-plus"></i> Simpan ke Kalender
                    </button>
                </form>
            </div>
        </div>

<div class="anim anim-3">
            <div class="mgmt-panel">
                <div class="entries-header">
                    <p class="mgmt-panel-title" style="margin-bottom:0"><i class="fas fa-calendar-days"></i> Acara Mendatang</p>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <a href="kalendar-akademik.html" target="_blank" class="view-cal-btn"><i class="fas fa-eye"></i> Lihat</a>
                        <a href="https://docs.google.com/spreadsheets/d/1RU8F2nbWMahKyJfo38l5SqysBiclVwrEouvgCY6-BNw/edit?gid=329965034#gid=329965034" target="_blank" class="sheets-link" id="sheetsLink"><i class="fas fa-table-cells"></i> Sheets</a>
                    </div>
                </div>
                <p class="entries-count" id="entriesCount">Memuat data...</p>
                <div id="entriesList"></div>
            </div>
        </div>
    </div>
</div>

<script src="script-teacher.js"></script>
<script>
    const APPS_SCRIPT_URL    = "https://script.google.com/macros/s/AKfycbw9JbR7u8Rr2KRC5E6zKlOor0f2wXf755VOWJaT810pEHIfah4MkdTsFCoB8Qog8Cj8/exec";
    const KALENDER_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwssRdD1LW3X9xBEIJBS7LIS5SkyZeO3d6Kz0jv3ldEr9hn8xdUVbe8NVWJajvqVT6pvXcaYzZRT4G/pub?output=csv";
    const KALENDER_SHEET_URL = "https://docs.google.com/spreadsheets/d/1RU8F2nbWMahKyJfo38l5SqysBiclVwrEouvgCY6-BNw/edit?gid=329965034#gid=329965034";

    const MONTHS_ID = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
    const BADGE_MAP = { liburan:"badge-liburan", ujian:"badge-ujian", kegiatan:"badge-kegiatan", upacara:"badge-upacara", rapat:"badge-rapat", lainnya:"badge-lainnya" };

    let teacher = null;
    document.addEventListener("DOMContentLoaded", () => {
        teacher = requireTeacherAuth();
        if (!teacher) return;
        const ini = teacher.name.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
        document.getElementById("avatarInitials").textContent = ini;
        document.getElementById("headerName").textContent = teacher.name;
        document.getElementById("headerRole").textContent = teacher.jabatan || teacher.id;

        const today = new Date().toISOString().split("T")[0];
        document.getElementById("kTanggalMulai").value = today;
        document.getElementById("kTanggalSelesai").value = today;
        if (!KALENDER_SHEET_URL.includes("PASTE")) document.getElementById("sheetsLink").href = KALENDER_SHEET_URL;
        loadEntries();
    });

    const DEMO = [
        { judul:"Ulangan Tengah Semester", kategori:"ujian", tanggal_mulai:"2026-06-02", tanggal_selesai:"2026-06-06", keterangan:"Semua mata pelajaran", warna:"#da251e" },
        { judul:"Libur Hari Raya Idul Adha", kategori:"liburan", tanggal_mulai:"2026-06-17", tanggal_selesai:"2026-06-17", keterangan:"Hari libur nasional", warna:"#4ade80" },
        { judul:"Pentas Seni Tahunan", kategori:"kegiatan", tanggal_mulai:"2026-07-05", tanggal_selesai:"2026-07-05", keterangan:"Gedung Serbaguna Lt. 1", warna:"#0088e3" },
        { judul:"Upacara Kenaikan Kelas", kategori:"upacara", tanggal_mulai:"2026-07-20", tanggal_selesai:"2026-07-20", keterangan:"Lapangan utama, pukul 07.00", warna:"#ffcc00" },
    ];

    async function loadEntries() {
        const countEl = document.getElementById("entriesCount");
        if (KALENDER_CSV_URL.includes("PASTE")) {
            renderEntries(DEMO);
            countEl.textContent = `${DEMO.length} acara (demo)`;
            return;
        }
        try {
            const res  = await fetch(KALENDER_CSV_URL);
            const text = await res.text();
            const rows = parseCSV(text);
            const data = rows.map(r => ({
                judul: r[0]||"", kategori: (r[1]||"lainnya").toLowerCase(),
                tanggal_mulai: r[2]||"", tanggal_selesai: r[3]||"",
                keterangan: r[4]||"", warna: r[5]||"#0088e3"
            })).filter(e => e.judul)
              .sort((a, b) => a.tanggal_mulai.localeCompare(b.tanggal_mulai));
            renderEntries(data);
            countEl.textContent = `${data.length} acara`;
        } catch {
            renderEntries(DEMO);
            countEl.textContent = `${DEMO.length} acara (demo)`;
        }
    }

    function parseCSV(text) {
        const lines = text.trim().split("\n");
        if (lines.length < 2) return [];
        return lines.slice(1).map(line => {
            const cells = []; let cur = "", inQ = false;
            for (let c of line) { if(c==='"'){inQ=!inQ}else if(c===','&&!inQ){cells.push(cur.trim());cur=""}else cur+=c }
            cells.push(cur.trim()); return cells;
        });
    }

    function formatDateBox(dateStr) {
        if (!dateStr) return { day: "?", mon: "???" };
        const d = new Date(dateStr + "T00:00:00");
        return { day: d.getDate(), mon: MONTHS_ID[d.getMonth()] };
    }

    function renderEntries(data) {
        const c = document.getElementById("entriesList");
        if (!data.length) {
            c.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-xmark"></i><p>Belum ada acara.</p></div>`;
            return;
        }

        const sorted = [...data].sort((a,b) => (a.tanggal_mulai||"") < (b.tanggal_mulai||"") ? -1 : 1);
        c.innerHTML = sorted.map(e => {
            const { day, mon } = formatDateBox(e.tanggal_mulai);
            const isMulti = e.tanggal_selesai && e.tanggal_selesai !== e.tanggal_mulai;
            const endBox  = isMulti ? formatDateBox(e.tanggal_selesai) : null;
            const badgeCls = BADGE_MAP[e.kategori] || "badge-lainnya";
            return `
            <div class="event-item">
                <div class="event-date-box" style="border-color:${e.warna}33;background:${e.warna}11">
                    <span class="event-date-day" style="color:${e.warna}">${day}</span>
                    <span class="event-date-mon">${mon}</span>
                </div>
                <div class="event-info">
                    <span class="event-badge ${badgeCls}">${e.kategori}</span>
                    <div class="event-title">${e.judul}</div>
                    <div class="event-sub">
                        ${isMulti ? `<i class="fas fa-arrow-right-long"></i> s/d ${endBox.day} ${endBox.mon}` : ""}
                        ${e.keterangan ? `<br>${e.keterangan}` : ""}
                    </div>
                </div>
            </div>`;
        }).join("");
    }

    async function submitKalender(e) {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        const warnaChecked = document.querySelector('input[name="warna"]:checked');
        const payload = {
            type: "kalender",
            judul: document.getElementById("kJudul").value.trim(),
            kategori: document.getElementById("kKategori").value,
            tanggalMulai: document.getElementById("kTanggalMulai").value,
            tanggalSelesai: document.getElementById("kTanggalSelesai").value,
            keterangan: document.getElementById("kKeterangan").value.trim(),
            warna: warnaChecked ? warnaChecked.value : "#0088e3"
        };
        if (APPS_SCRIPT_URL.includes("PASTE")) {
            await new Promise(r => setTimeout(r, 800));
            document.getElementById("kalenderForm").reset();
            showToast("Demo: acara akan tersimpan setelah Apps Script terhubung.");
        } else {
            try {
                const blob = new Blob([JSON.stringify(payload)], { type: "text/plain" });
                navigator.sendBeacon(APPS_SCRIPT_URL, blob);
                document.getElementById("kalenderForm").reset();
                showToast("✅ Acara berhasil ditambahkan ke kalender!");
                setTimeout(loadEntries, 2000);
            } catch {
                showToast("❌ Gagal menyimpan. Coba lagi.", true);
            }
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-calendar-plus"></i> Simpan ke Kalender';
    }

    function showToast(msg, isErr=false) {
        const ex = document.querySelector(".toast"); if(ex) ex.remove();
        const t = document.createElement("div");
        t.className = "toast " + (isErr ? "toast-err" : "toast-ok");
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }
</script>
</body>
</html>
